<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ViralClip AI - Turn Podcasts into Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">

  <div class="max-w-xl w-full text-center space-y-6">
    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
      ViralClip AI
    </h1>
    <p class="text-slate-400">Paste any YouTube URL to extract high-scoring 9:16 viral shorts automatically.</p>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <input id="videoUrl" type="text" placeholder="Paste YouTube Link Here..." 
             class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-purple-500 text-white"/>
      
      <button onclick="processVideo()" id="btn" 
              class="w-full bg-gradient-to-r from-purple-500 to-pink-500 py-3 rounded-lg font-bold hover:opacity-90 transition">
        Generate Viral Short
      </button>
    </div>

    <!-- Results Area -->
    <div id="results" class="hidden space-y-4 bg-slate-800 p-6 rounded-xl border border-slate-700">
      <div class="flex justify-between items-center text-lg font-semibold">
        <span>Virality Score:</span>
        <span id="scoreBadge" class="px-3 py-1 bg-green-500/20 text-green-400 rounded-full border border-green-500">92/100</span>
      </div>
      <video id="player" controls class="w-64 mx-auto rounded-lg shadow-xl border border-slate-700"></video>
    </div>
  </div>

  <script>
    // Replace with your live ngrok URL from Colab
    const API_BASE = "https://announce-path-reverse-races.trycloudflare.com"; 

  async function processVideo() {
  const url = document.getElementById('videoUrl').value;
  const btn = document.getElementById('btn');
  if(!url) return alert("Please enter a YouTube link!");

  btn.innerText = "Analyzing Virality & Rendering...";
  btn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/generate-clip`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ video_url: url })
    });
    
    if (!res.ok) throw new Error("Backend processing failed.");
    
    const data = await res.json();

    document.getElementById('scoreBadge').innerText = `${data.virality_score}/100`;
    
    // Set the complete absolute video URL with a cache-busting timestamp
    const videoPlayer = document.getElementById('player');
    videoPlayer.src = `${API_BASE}/get-video?t=${Date.now()}`;
    videoPlayer.load(); // Force the HTML5 player to load the new video stream
    
    document.getElementById('results').classList.remove('hidden');
  } catch (err) {
    alert("Processing failed. Make sure your Colab notebook server is running!");
  } finally {
    btn.innerText = "Generate Viral Short";
    btn.disabled = false;
  }
}
  </script>
</body>
</html>
