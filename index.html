<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Short Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
    <!-- Header -->
    <h1 class="text-3xl font-extrabold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
      AI Viral Clip Generator
    </h1>
    <p class="text-slate-400 text-center text-sm mb-6">
      Paste a YouTube link to extract the most engaging 30-second short clip.
    </p>

    <!-- Input Section -->
    <div class="space-y-4">
      <div>
        <label for="videoUrl" class="block text-xs font-semibold uppercase text-slate-400 mb-1">YouTube URL</label>
        <input 
          type="url" 
          id="videoUrl" 
          placeholder="https://www.youtube.com/watch?v=..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition"
        />
      </div>

      <button 
        id="btn" 
        onclick="processVideo()" 
        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Generate Viral Short
      </button>
    </div>

    <!-- Results Display Section -->
    <div id="results" class="hidden mt-8 border-t border-slate-700 pt-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Virality Score:</h2>
        <span id="scoreBadge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-lg font-bold px-3 py-1 rounded-full">
          0/100
        </span>
      </div>

      <div class="relative w-full aspect-[9/16] bg-black rounded-lg overflow-hidden border border-slate-700 max-w-xs mx-auto shadow-xl">
        <video id="player" controls class="w-full h-full object-cover">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ UPDATE THIS WITH YOUR ACTIVE NGROK URL (NO TRAILING SLASH)
    const API_BASE = "https://reliance-reselect-dragonfly.ngrok-free.dev";

    async function processVideo() {
      const urlInput = document.getElementById('videoUrl');
      const btn = document.getElementById('btn');
      const resultsDiv = document.getElementById('results');
      const scoreBadge = document.getElementById('scoreBadge');
      const videoPlayer = document.getElementById('player');

      const url = urlInput ? urlInput.value.trim() : '';

      if (!url) {
        alert("Please enter a valid YouTube link!");
        return;
      }

      // 1. Instantly update UI loading state
      btn.innerText = "Analyzing Virality & Rendering...";
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/generate-clip`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ video_url: url })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || "Server error while processing video.");
        }

        const data = await res.json();

        // 2. Set score badge
        scoreBadge.innerText = `${data.virality_score}/100`;

        // 3. Load video source with timestamp to prevent browser caching issues
        videoPlayer.src = `${API_BASE}/get-video?t=${Date.now()}`;
        videoPlayer.load();

        // 4. Reveal results card
        resultsDiv.classList.remove('hidden');

      } catch (err) {
        console.error("Error generating clip:", err);
        alert(`Processing failed: ${err.message}\n\nMake sure your Colab notebook is running and API_BASE is updated.`);
      } finally {
        // 5. Reset button UI
        btn.innerText = "Generate Viral Short";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
